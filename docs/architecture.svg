<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="430" rx="16" fill="#0b1220"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8a97b1"/></marker>
  </defs>
  <text x="32" y="44" fill="#e6ebf5" font-size="20" font-weight="700">Blastproof on Vultr</text>
  <text x="32" y="68" fill="#8a97b1" font-size="13">The model is untrusted. Its code only ever touches a disposable sandbox.</text>

  <!-- browser -->
  <rect x="32" y="170" width="150" height="86" rx="12" fill="#111a2e" stroke="#26344f"/>
  <text x="107" y="205" text-anchor="middle" fill="#e6ebf5" font-size="15" font-weight="600">Browser</text>
  <text x="107" y="226" text-anchor="middle" fill="#8a97b1" font-size="12">question + file</text>
  <text x="107" y="243" text-anchor="middle" fill="#8a97b1" font-size="12">live SSE timeline</text>

  <!-- VM boundary -->
  <rect x="222" y="96" width="746" height="306" rx="14" fill="none" stroke="#60a5fa" stroke-dasharray="6 5" opacity=".7"/>
  <text x="240" y="120" fill="#60a5fa" font-size="12" font-weight="600">VULTR CLOUD COMPUTE · Ubuntu 24.04 VM</text>

  <!-- control plane -->
  <rect x="246" y="140" width="290" height="146" rx="12" fill="#111a2e" stroke="#60a5fa"/>
  <text x="391" y="168" text-anchor="middle" fill="#e6ebf5" font-size="15" font-weight="600">Control plane</text>
  <text x="391" y="190" text-anchor="middle" fill="#8a97b1" font-size="12">Caddy HTTPS → FastAPI (systemd, non-root)</text>
  <text x="391" y="210" text-anchor="middle" fill="#8a97b1" font-size="12">agent loop · pre-flight AST review</text>
  <text x="391" y="230" text-anchor="middle" fill="#8a97b1" font-size="12">receipts check · audit log (SQLite)</text>
  <text x="391" y="256" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">holds the only secret</text>
  <text x="391" y="274" text-anchor="middle" fill="#8a97b1" font-size="11">(Vultr Inference API key)</text>

  <!-- inference -->
  <rect x="246" y="318" width="290" height="66" rx="12" fill="#0f2140" stroke="#60a5fa"/>
  <text x="391" y="344" text-anchor="middle" fill="#e6ebf5" font-size="14" font-weight="600">Vultr Serverless Inference</text>
  <text x="391" y="365" text-anchor="middle" fill="#8a97b1" font-size="12">plan · code · repair · explain · chart check</text>

  <!-- sandbox -->
  <rect x="594" y="140" width="352" height="244" rx="12" fill="#0b2a22" stroke="#34d399" stroke-dasharray="7 5"/>
  <text x="770" y="168" text-anchor="middle" fill="#e6ebf5" font-size="15" font-weight="600">Disposable sandbox (one per run)</text>
  <text x="770" y="188" text-anchor="middle" fill="#34d399" font-size="12">Docker · gVisor runsc · destroyed after every run</text>
  <g font-size="12" fill="#c9f5e3">
    <text x="616" y="220">✓ --network none (no DNS, no metadata)</text>
    <text x="616" y="242">✓ 0 secrets (env allowlist)</text>
    <text x="616" y="264">✓ read-only rootfs + read-only dataset</text>
    <text x="616" y="286">✓ 512 MB RAM, swap off · 1 vCPU · 64 pids</text>
    <text x="616" y="308">✓ cap-drop ALL · seccomp · no-new-privileges</text>
    <text x="616" y="330">✓ non-root uid 10001 · tmpfs quotas</text>
    <text x="616" y="352">✓ soft + hard time limit · output byte cap</text>
  </g>

  <!-- arrows -->
  <line x1="182" y1="213" x2="242" y2="213" stroke="#8a97b1" stroke-width="2" marker-end="url(#a)"/>
  <line x1="391" y1="288" x2="391" y2="314" stroke="#8a97b1" stroke-width="2" marker-end="url(#a)"/>
  <line x1="536" y1="196" x2="590" y2="196" stroke="#8a97b1" stroke-width="2" marker-end="url(#a)"/>
  <text x="563" y="186" text-anchor="middle" fill="#8a97b1" font-size="10">code</text>
  <line x1="590" y1="240" x2="540" y2="240" stroke="#8a97b1" stroke-width="2" marker-end="url(#a)"/>
  <text x="563" y="258" text-anchor="middle" fill="#8a97b1" font-size="10">results</text>
</svg>
